[project]
name = "deputy"
description = "MCP server: a frontier model orchestrates, any other model does the legwork."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dynamic = ["version"]
requires-python = ">=3.11"
authors = [{ name = "Tommaso Marchionni" }]
keywords = ["mcp", "llm", "agents", "delegation", "llama.cpp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "regex>=2026.11.15",
  "jsonschema>=4.26.0",
]

[project.urls]
Homepage = "https://github.com/tommasomarchionni/deputy"
Issues = "https://github.com/tommasomarchionni/deputy/issues"

[project.scripts]
deputy = "deputy.cli:main"
deputy-hook = "deputy.hook:main"  # the read hint; imports almost nothing, it runs on every read

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-cov>=6",
    "ruff>=0.17",
    "pyright>=1.1.400",
    "hypothesis>=6.170.15",
    "pytest-randomly>=5.1.0",
    "pytest-socket>=0.8.1",
    "pytest-timeout>=2.4.0",
    "syrupy>=7.0.2",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.8.1",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/deputy"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools/ci"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT", "C4", "PL"]
ignore = ["PLR2004", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR"]
"tools/**" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools/ci", "tests", "tests/integration"]
addopts = "-q --strict-markers --disable-socket --allow-unix-socket"
timeout = 120
markers = [
  "live: needs a real model server (set DEPUTY_LIVE_URL)",
  "integration: crosses a real socket or process (only the model is faked)",
]

[tool.coverage.run]
source = ["deputy"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.pyright]
include = ["src", "tests", "tools"]
extraPaths = ["tools/ci"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
