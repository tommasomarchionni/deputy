changelog:
  exclude:
    labels: [dependencies, github_actions]
    authors: [dependabot]
  categories:
    - title: "Features"
      labels: ["type: feature"]
    - title: "Fixes"
      labels: ["type: bug"]
    - title: "Security"
      labels: ["type: security"]
    - title: "Documentation"
      labels: ["type: docs"]
    - title: "Other changes"
      labels: ["*"]
