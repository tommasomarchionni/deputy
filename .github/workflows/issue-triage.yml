name: Issue triage

# Turns the answers of the issue form (area, priority) into labels and marks the issue for triage.
on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  triage:
    name: Issue triage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Label from the form
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 tools/ci/issue_triage.py
