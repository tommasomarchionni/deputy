name: Labels sync

# .github/labels.json is the list of labels: a change on main is applied to the repository.
# Labels missing from the file are reported, never deleted (an issue would lose them).
on:
  push:
    branches: [main]
    paths: [".github/labels.json", "tools/ci/sync_labels.py", "tools/ci/ghapi.py"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labels-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Labels sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply .github/labels.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/ci/sync_labels.py | tee -a "$GITHUB_STEP_SUMMARY"
