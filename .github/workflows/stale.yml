name: Stale issues and PRs

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    name: Stale
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,type: security,status: blocked,status: needs-decision"
          exempt-pr-labels: "pinned,type: security"
          stale-issue-message: >
            This issue has had no activity for 60 days and will be closed in 14 days if nothing
            changes. If it is still relevant, comment to keep it open.
          stale-pr-message: >
            This pull request has had no activity for 60 days and will be closed in 14 days if
            nothing changes.
