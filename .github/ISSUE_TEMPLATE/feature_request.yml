name: Idea or feature
description: Propose a change, with the problem it solves
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or wrong today, ideally with a measured example.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
    validations:
      required: true
  - type: textarea
    id: measure
    attributes:
      label: How we would know it works
      description: The benchmark task or metric that would show the improvement.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [server, sandbox, checks, bench, cli, installer, memory, router, docs, ci]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: p0 drop everything, p1 next, p2 planned, p3 nice to have
      options: [p0, p1, p2, p3]
      default: 2
    validations:
      required: true
