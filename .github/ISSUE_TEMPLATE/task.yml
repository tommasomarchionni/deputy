name: Task
description: Work to do that is neither a bug nor a new feature (measurement, cleanup, verification)
labels: ["type: task"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this is needed, with what was measured or observed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: A checklist; each item must be provable in the pull request.
      value: |
        - [ ] 
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [server, sandbox, checks, bench, cli, installer, memory, router, docs, ci]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: p0 drop everything, p1 next, p2 planned, p3 nice to have
      options: [p0, p1, p2, p3]
      default: 2
    validations:
      required: true
