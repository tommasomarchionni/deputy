name: Bug report
description: Something does not work as documented
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Smallest steps or input. Do not paste secrets or private code.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, agent (Claude Code, Copilot, ...), model and how it is served.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [server, sandbox, checks, bench, cli, installer, memory, router, docs, ci]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: p0 drop everything, p1 next, p2 planned, p3 nice to have
      options: [p0, p1, p2, p3]
      default: 2
    validations:
      required: true
